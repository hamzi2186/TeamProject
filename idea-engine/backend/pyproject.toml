[project]
name = "idea-engine-backend"
version = "0.1.0"
description = "T Rex Idea Engine — Lead Intelligence & Daily DOCX Reporting Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.9.1",
    "PyJWT[crypto]>=2.10.1",
    "httpx>=0.28.1",
    "python-docx>=1.1.2",
    "celery[redis]>=5.5.2",
    "redis>=5.2.1",
    "alembic>=1.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app"]
