services:
  # ── Redis (Message broker for Celery) ──────────────────────────────────
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── TPI Engine (Third-Party Integration Boundary) ──────────────────────
  tpi:
    build: ./tpi-engine/backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      TPI_INTERNAL_SERVICE_TOKEN: ${TPI_INTERNAL_SERVICE_TOKEN:-replace-with-shared-service-token}
      CALLING_INTERNAL_WEBHOOK_URL: http://calling-backend:8002/api/v1/webhooks/vapi/events
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Calling Backend (FastAPI, Auth, Leads, HubSpot, Calling API) ───────
  calling-backend:
    build: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: http://tpi:8001
      TPI_INTERNAL_SERVICE_TOKEN: ${TPI_INTERNAL_SERVICE_TOKEN:-replace-with-shared-service-token}
      CALLING_INTERNAL_WEBHOOK_URL: http://calling-backend:8002/api/v1/webhooks/vapi/events
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"]
    ports:
      - "8002:8002"
    volumes:
      - ./.secrets:/app/.secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Calling Worker (Celery task executor) ──────────────────────────────
  calling-worker:
    build: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: http://tpi:8001
      TPI_INTERNAL_SERVICE_TOKEN: ${TPI_INTERNAL_SERVICE_TOKEN:-replace-with-shared-service-token}
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "calling.calls,platform.default"]
    volumes:
      - ./.secrets:/app/.secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      calling-backend:
        condition: service_healthy

  # ── Main Frontend (React 19 / Vite / Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8002
        VITE_ROOT_AUTH_URL: http://localhost:5173/auth/login
    ports:
      - "5173:80"
    depends_on:
      calling-backend:
        condition: service_healthy

volumes:
  redis_data:
