services:
  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── TPI Engine ─────────────────────────────────────────────────────────
  tpi:
    build: ./tpi-engine/backend
    env_file:
      - ./backend/.env
      - ./tpi-engine/backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CALLING_INTERNAL_WEBHOOK_URL: http://backend:8000/api/v1/webhooks/vapi/events
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Root Platform Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      SCRAPER_API_BASE_URL: http://scraper-backend:8002
      AUTH_JWT_PRIVATE_KEY_PATH: /app/.secrets/auth_private.pem
      AUTH_JWT_PUBLIC_KEY_PATH: /app/.secrets/auth_public.pem
      CALLING_INTERNAL_WEBHOOK_URL: http://backend:8000/api/v1/webhooks/vapi/events
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.secrets:/app/.secrets
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Root Platform Worker ───────────────────────────────────────────────
  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWT_PRIVATE_KEY_PATH: /app/.secrets/auth_private.pem
      AUTH_JWT_PUBLIC_KEY_PATH: /app/.secrets/auth_public.pem
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "platform.default,platform.auth_email,calling.calls"]
    volumes:
      - ./backend/.secrets:/app/.secrets
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
      backend:
        condition: service_healthy

  # ── Root Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_ROOT_AUTH_URL: http://localhost:5173/auth/login
    environment:
      BACKEND_URL: http://backend:8000
      AGENT_FRONTEND_URL: http://agent-frontend:80
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # ── Scraper Engine ─────────────────────────────────────────────────────
  scraper-backend:
    build: ./scraper-engine/backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
      FRONTEND_ORIGINS: http://localhost:5174,http://localhost:5173
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN:-local-scraper-service-token}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 12

  scraper-worker:
    build: ./scraper-engine/backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
      SCRAPER_INTERNAL_SERVICE_TOKEN: ${SCRAPER_INTERNAL_SERVICE_TOKEN:-local-scraper-service-token}
      IS_CELERY_WORKER: "true"
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-100}
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "scraper.crawling,scraper.embeddings"]
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
      scraper-backend:
        condition: service_healthy

  scraper-frontend:
    build:
      context: ./scraper-engine/frontend
      args:
        VITE_SCRAPER_API_BASE_URL: http://localhost:8002
        VITE_PLATFORM_FRONTEND_URL: http://localhost:5173
    ports:
      - "5174:80"
    depends_on:
      scraper-backend:
        condition: service_healthy

  # ── Agent Engine ───────────────────────────────────────────────────────
  agent-backend:
    build: ./agent-engine/backend
    env_file:
      - ./backend/.env
    environment:
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
      FRONTEND_ORIGINS: http://localhost:5174,http://localhost:5173,http://localhost:5177
      DOCS_ROOT_PATH: /app/docs/agent-knowledge
    volumes:
      - ./docs:/app/docs:ro
    ports:
      - "8003:8003"
    depends_on:
      tpi:
        condition: service_healthy
        required: false
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-frontend:
    build:
      context: ./agent-engine/frontend
      args:
        VITE_AGENT_API_BASE_URL: http://localhost:8003
        VITE_PLATFORM_FRONTEND_URL: http://localhost:5173
    ports:
      - "5177:80"
    depends_on:
      agent-backend:
        condition: service_healthy

  # ── SMS Engine ─────────────────────────────────────────────────────────
  sms-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SMS_DB_USER:-sms}
      POSTGRES_PASSWORD: ${SMS_DB_PASSWORD:-sms}
      POSTGRES_DB: ${SMS_DB_NAME:-trex_sms}
    ports:
      - "5433:5432"
    volumes:
      - sms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMS_DB_USER:-sms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sms-backend:
    build: ./sms-engine/backend
    env_file:
      - ./sms-engine/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${SMS_DB_USER:-sms}:${SMS_DB_PASSWORD:-sms}@sms-db:5432/${SMS_DB_NAME:-trex_sms}
      REDIS_URL: redis://redis:6379/1
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
      FRONTEND_URL: http://localhost:5175
      SMS_ENGINE_INTERNAL_BASE_URL: http://sms-backend:8004
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8004"]
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
      backend:
        condition: service_healthy
      sms-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  sms-worker:
    build: ./sms-engine/backend
    env_file:
      - ./sms-engine/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${SMS_DB_USER:-sms}:${SMS_DB_PASSWORD:-sms}@sms-db:5432/${SMS_DB_NAME:-trex_sms}
      REDIS_URL: redis://redis:6379/1
      TPI_API_BASE_URL: ${TPI_API_BASE_URL:-http://tpi:8001}
      AUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
      SMS_ENGINE_INTERNAL_BASE_URL: http://sms-backend:8004
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "sms.conversations"]
    depends_on:
      redis:
        condition: service_healthy
      tpi:
        condition: service_healthy
        required: false
      sms-backend:
        condition: service_healthy

  sms-frontend:
    build:
      context: ./sms-engine/frontend
      args:
        VITE_SMS_API_BASE_URL: http://localhost:8004
        VITE_SMS_PROVIDER: ${SMS_PROVIDER:-mock}
    ports:
      - "5175:80"
    depends_on:
      sms-backend:
        condition: service_healthy

volumes:
  redis_data:
  sms_db_data:
